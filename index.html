<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho TNP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sổ kho của xưởng — thanh tab trên, nội dung một cột rộng tối đa 1100px, bảng cuộn ngang trong khung riêng */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --sunk:#E8EEE5; --line:#D3DDD0;
  --fg:#18261D; --muted:#5D6E62; --accent:#2D6A3E; --accent-ink:#FFFFFF; --accent-soft:#DCEBDD;
  --soil:#9A6417; --soil-soft:#F5E8D2;
  --ok:#2D7A44; --ok-soft:#DDF0E1; --warn:#A35E00; --warn-soft:#FCEBCF; --bad:#B42318; --bad-soft:#FBE1DE;
  --info:#2F5D8A; --info-soft:#DDE8F4;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#18211B; --sunk:#202B23; --line:#2E3B32;
  --fg:#E4ECE5; --muted:#9AAA9F; --accent:#6FBF84; --accent-ink:#0D1A11; --accent-soft:#1F3A27;
  --soil:#E0A94F; --soil-soft:#3A2C14;
  --ok:#74C68B; --ok-soft:#1C3424; --warn:#F0B055; --warn-soft:#3A2A12; --bad:#F2877B; --bad-soft:#3D1D1A;
  --info:#8DB6E2; --info-soft:#1C2B3B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#18211B; --sunk:#202B23; --line:#2E3B32;
  --fg:#E4ECE5; --muted:#9AAA9F; --accent:#6FBF84; --accent-ink:#0D1A11; --accent-soft:#1F3A27;
  --soil:#E0A94F; --soil-soft:#3A2C14;
  --ok:#74C68B; --ok-soft:#1C3424; --warn:#F0B055; --warn-soft:#3A2A12; --bad:#F2877B; --bad-soft:#3D1D1A;
  --info:#8DB6E2; --info-soft:#1C2B3B; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 8px;flex-wrap:wrap}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.who{font-size:12.5px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding-top:20px}
section.view{display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h2{margin:0;font-size:18px;font-weight:700}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:62ch}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.soil{background:var(--soil);color:#fff;border-color:var(--soil)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.kpi b{font-size:26px;font-weight:700;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.info b{color:var(--info)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel>h3{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.panel>h3 small{font-weight:400;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--sunk)}
tbody tr.short td{background:var(--bad-soft)} tbody tr.short td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tbody tr.tight td{background:var(--warn-soft)} tbody tr.tight td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tbody tr.short.click:hover td,tbody tr.tight.click:hover td{filter:brightness(.97)}
.code{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--sunk);color:var(--muted)} .p-acc{background:var(--accent-soft);color:var(--accent)}
.p-soil{background:var(--soil-soft);color:var(--soil)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.pick{position:relative;min-width:0}
.pick-ls{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:280px;overflow-y:auto;padding:4px;min-width:240px}
.pick-op{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;font-weight:400;color:var(--fg);font-size:14px}
.pick-op small{color:var(--muted);white-space:nowrap;font-size:12px}
.pick-op b{font-weight:700;color:var(--accent)}
.pick-op.on,.pick-op:hover{background:var(--accent-soft)}
.pick-no{padding:10px;color:var(--muted);font-weight:400;font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.cards{display:flex;flex-direction:column;gap:10px}
.ord{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.ord.s-thu{border-left-color:var(--info)} .ord.s-qd{border-left-color:var(--accent)} .ord.s-huy{border-left-color:var(--muted);opacity:.75}
.ord-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.ord-top .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.ord-top .t b{font-size:15px}
.ord-top .t small{color:var(--muted)}
.ord-acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ord details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.ord details[open] summary{margin-bottom:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:13px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.prod .ph{padding:12px 16px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;border-bottom:1px solid var(--line)}
.prod .ph b{font-size:15px;display:block}
.prod .ph small{color:var(--muted)}
.prod ul{list-style:none;margin:0;padding:8px 16px;display:flex;flex-direction:column;gap:3px;flex:1}
.prod li{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.prod li span:last-child{white-space:nowrap;color:var(--muted)}
.prod b b,.prod small b,.prod li b{color:var(--accent);background:var(--accent-soft);border-radius:3px;font-weight:700}
.prod .pf{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.prod .pf b{color:var(--soil)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,20,14,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto}
.md{background:var(--surface);border-radius:14px;width:100%;max-width:640px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.md.wide{max-width:820px}
.md header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.md header h3{margin:0;font-size:17px}
.md .bd{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
.md footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea,.frow input,.frow select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;font-size:14px;color:var(--fg);width:100%;min-width:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.err{font-size:13px;color:var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:8px}
.frows{display:flex;flex-direction:column;gap:8px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) 110px 58px 34px;gap:8px;align-items:center}
.frow .u{font-size:13px;color:var(--muted)}
.frow .rm{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-width:0;flex:1 1 220px;max-width:340px}
.banner{padding:10px 14px;border-radius:8px;font-size:13.5px;background:var(--info-soft);color:var(--info)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.bar label.f input[type=search]{flex:none;max-width:none;width:100%}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.mut{color:var(--muted)}
.neg{color:var(--bad);font-weight:600}
.sum-line{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.md{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(8px);opacity:.6}}}
</style>
</head><body>

<header class="top"><div class="wrap" style="padding-block:0">
  <div class="brand"><h1>Sản xuất <span>&amp;</span> Kho TNP <small style="font-size:12px;font-weight:600;color:var(--accent)">TRỰC TUYẾN</small></h1><div class="who" id="who" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"></div></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="tong" aria-selected="true">Tổng quan</button>
    <button role="tab" data-v="lenh">Lệnh sản xuất</button>
    <button role="tab" data-v="sp">Công thức</button>
    <button role="tab" data-v="kho">Kho nguyên liệu</button>
    <button role="tab" data-v="nhap">Nhập kho</button>
  </nav>
</div></header>

<div class="wrap"><main id="main">
  <div class="empty"><b>Đang kết nối…</b></div>
</main></div>
<div id="layer"></div>

<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("vi-VN", {maximumFractionDigits: 3});
const vnd = new Intl.NumberFormat("vi-VN", {maximumFractionDigits: 0});
const fmt = n => nf.format(Math.round((+n || 0) * 1000) / 1000);
const money = n => vnd.format(Math.round(+n || 0)) + " đ";
const num = v => { const x = parseFloat(String(v).replace(",", ".")); return isFinite(x) ? x : NaN; };
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const dshow = s => { if (!s) return ""; const [y,m,d] = String(s).slice(0,10).split("-"); return d && m ? `${d}/${m}/${y}` : s; };

const S = { kho:{}, sp:{}, lenh:{}, nhap:{}, ready:{kho:0,sp:0,lenh:0,nhap:0} };
let db = null, U = null, myId = null, canWrite = true, names = {};
let view = "tong", lenhFilter = "thu", khoQ = "", spQ = "", tongQ = "", lenhQ = "", lenhFrom = "", lenhTo = "", pendingConfirm = null;
try { const v = localStorage.getItem("keps-tab"); if (v) view = v; } catch {}

/* ---------- tính toán ---------- */
const ORD = { thu:"Lên thử đơn", qd:"Quyết định làm", huy:"Đã hủy" };
const sortVi = (a,b) => String(a).localeCompare(String(b), "vi");
const khoList = () => Object.entries(S.kho).map(([id,d]) => ({id,...d})).sort((a,b)=>sortVi(a.ma||a.ten,b.ma||b.ten));
const spList = () => Object.entries(S.sp).map(([id,d]) => ({id,...d})).sort((a,b)=>sortVi(a.ten,b.ten));
const lenhList = () => Object.entries(S.lenh).map(([id,d]) => ({id,...d})).sort((a,b)=> String(b.ma).localeCompare(String(a.ma)));
const nhapList = () => Object.entries(S.nhap).map(([id,d]) => ({id,...d})).sort((a,b)=> String(b.ngay||"").localeCompare(String(a.ngay||"")) || (b.t||0)-(a.t||0));

function canDoi() {
  const nhap = {}, xuat = {}, thu = {}, gia = {};
  for (const n of Object.values(S.nhap)) {
    nhap[n.nlId] = (nhap[n.nlId]||0) + (+n.soluong||0);
    if (+n.dongia > 0) { const g = gia[n.nlId] ||= {q:0,v:0}; g.q += +n.soluong||0; g.v += (+n.soluong||0)*(+n.dongia); }
  }
  for (const l of Object.values(S.lenh)) {
    if (l.trangthai === "qd") for (const t of (l.tieuthu||[])) xuat[t.nlId] = (xuat[t.nlId]||0) + (+t.luong||0);
    if (l.trangthai === "thu") for (const t of nhuCau(l.spId, l.soluong)) thu[t.nlId] = (thu[t.nlId]||0) + t.luong;
  }
  const out = {};
  for (const k of khoList()) {
    const ton = (+k.tonDau||0) + (nhap[k.id]||0) - (xuat[k.id]||0);
    const g = gia[k.id];
    out[k.id] = { ton, nhap:nhap[k.id]||0, xuat:xuat[k.id]||0, thu:thu[k.id]||0, conLai: ton-(thu[k.id]||0),
      canMua: Math.max(0,(thu[k.id]||0)-ton), giaTB: g && g.q>0 ? g.v/g.q : (+k.dongia||0) };
  }
  return out;
}
function nhuCau(spId, sl) {
  const sp = S.sp[spId]; if (!sp) return [];
  return (sp.congthuc||[]).filter(r => r.nlId && S.kho[r.nlId]).map(r => ({ nlId:r.nlId, ten:S.kho[r.nlId].ten, donvi:S.kho[r.nlId].donvi, luong:(+r.luong||0)*(+sl||0) }));
}
function trangThaiKho(k, c) {
  if (c.ton < 0) return ["Âm kho","p-bad"];
  if (c.canMua > 0) return ["Thiếu cho đơn thử","p-bad"];
  if (c.ton <= (+k.tonMin||0)) return ["Sắp hết","p-warn"];
  return ["Đủ","p-ok"];
}
function kiemTra(spId, sl, tinh) {
  const thieu = [];
  for (const t of nhuCau(spId, sl)) { const ton = tinh[t.nlId]?.ton ?? 0; if (t.luong > ton + 1e-9) thieu.push({...t, ton, thieu:t.luong-ton}); }
  return thieu;
}
function giaVon(sp, tinh) {
  let v = 0, du = true;
  for (const r of (sp.congthuc||[])) { const g = tinh[r.nlId]?.giaTB || 0; if (!g) du = false; v += g*(+r.luong||0); }
  return {v, du};
}

/* ---------- ghi dữ liệu ---------- */
let toastT;
function toast(msg) { clearTimeout(toastT); $("#toast")?.remove(); const t = document.createElement("div"); t.className="toast"; t.id="toast"; t.textContent=msg; document.body.append(t); toastT=setTimeout(()=>t.remove(),2600); }
let write = async function (fn, ok) {
  if (!db) { toast("Chưa kết nối được dữ liệu. Hãy đăng nhập lại."); return false; }
  try { await fn(); if (ok) toast(ok); return true; }
  catch (e) {
    if (e?.code === "invalid_argument" && !canWrite) toast("Bạn chỉ có quyền xem, không thể ghi dữ liệu.");
    else if (e?.code === "invalid_argument") { canWrite = false; render(); toast("Tài khoản này chỉ có quyền xem. Nhờ Quản lý cấp quyền Nhập liệu."); }
    else if (e?.code === "quota_exceeded") toast("Bộ nhớ dữ liệu đã đầy. Hãy xóa bớt phiếu nhập cũ.");
    else toast("Chưa lưu được, thử lại sau ít giây.");
    console.error(e); return false;
  }
}
const stamp = () => ({ t: Date.now(), by: myId || null });

/* ---------- đưa nguyên liệu thiếu lên đầu ---------- */
const mucKho = (k, c) => (c.ton < 0 || c.canMua > 0) ? 0 : (c.ton <= (+k.tonMin||0)) ? 1 : 2;
const xepThieu = (arr, sev) => arr.map((x,i)=>[sev(x),i,x]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]).map(x=>x[2]);
const lopMuc = m => m===0 ? "short" : m===1 ? "tight" : "";
/* ---------- giữ nguyên liệu giữa các lệnh thử đơn ---------- */
function thuMap() {
  const m = {};
  for (const [id,l] of Object.entries(S.lenh)) if (l.trangthai === "thu")
    for (const t of nhuCau(l.spId, l.soluong)) (m[t.nlId] ||= []).push({id, ma:l.ma, luong:t.luong});
  return m;
}
function phanTich(spId, sl, tinh, exceptId) {
  const tm = thuMap();
  return nhuCau(spId, sl).map(r => {
    const ton = tinh[r.nlId]?.ton ?? 0;
    const others = (tm[r.nlId] || []).filter(x => x.id !== exceptId);
    const giu = others.reduce((s,x) => s + x.luong, 0);
    return {...r, ton, giu, others, conLai: ton - giu - r.luong,
      thieuRieng: Math.max(0, r.luong - ton), thieuChung: Math.max(0, r.luong + giu - ton)};
  });
}
function ketLuan(pt) {
  const rieng = pt.filter(r => r.thieuRieng > 1e-9), chung = pt.filter(r => r.thieuChung > 1e-9);
  const lenhKhac = [...new Set(chung.flatMap(r => r.others.map(o => o.ma)))];
  if (rieng.length) return {lv:"bad", pill:`Thiếu ${rieng.length} nguyên liệu`, txt:`Thiếu ${rieng.length} nguyên liệu ngay cả khi chỉ làm riêng lệnh này`, lenhKhac};
  if (chung.length) return {lv:"warn", pill:"Đủ riêng, thiếu nếu làm hết", txt:`Đủ nếu làm lệnh này trước. Nhưng ${chung.length} nguyên liệu không đủ cho cả ${lenhKhac.join(", ")}`, lenhKhac};
  return {lv:"ok", pill:"Đủ cho mọi đơn thử", txt: pt.some(r=>r.giu>0) ? "Đủ nguyên liệu, kể cả phần các đơn thử khác đang giữ" : "Đủ nguyên liệu để sản xuất", lenhKhac};
}
function bangPT(pt) {
  return `<div class="tbl-wrap"><table><thead><tr><th>Nguyên liệu</th><th class="n">Cần</th><th class="n">Tồn kho</th><th class="n" title="Tổng nguyên liệu các lệnh thử đơn khác cần">Đơn thử khác giữ</th><th class="n">Còn lại nếu làm hết</th><th class="n">Thiếu</th></tr></thead><tbody>${xepThieu(pt, r => r.thieuRieng>1e-9?0:r.thieuChung>1e-9?1:2).map(r => `<tr class="${r.thieuRieng>1e-9?"short":r.thieuChung>1e-9?"tight":""}"><td>${esc(r.ten)}</td><td class="n">${fmt(r.luong)} <span class="mut">${esc(r.donvi)}</span></td><td class="n">${fmt(r.ton)}</td><td class="n">${r.giu>0?`${fmt(r.giu)}<div class="mut" style="font-size:11.5px">${esc(r.others.map(o=>o.ma).join(", "))}</div>`:"–"}</td><td class="n ${r.conLai<-1e-9?"neg":""}">${fmt(r.conLai)}</td><td class="n">${r.thieuRieng>1e-9?`<span class="neg">${fmt(r.thieuRieng)}</span>`:r.thieuChung>1e-9?`<span style="color:var(--warn);font-weight:600">${fmt(r.thieuChung)}*</span>`:"–"}</td></tr>`).join("")}</tbody></table></div>
  ${pt.some(r=>r.thieuChung>1e-9 && r.thieuRieng<=1e-9) ? `<p class="hint">* Số thiếu khi làm cả các đơn thử khác. Kho hiện tại vẫn đủ cho riêng lệnh này.</p>` : ""}`;
}
const PILL = {ok:"p-ok", warn:"p-warn", bad:"p-bad"};
async function doQd(id) {
  const l = S.lenh[id];
  await write(()=>db.doc("lenh/"+id).update({trangthai:"qd", tieuthu:nhuCau(l.spId,l.soluong), qdNgay:today(), qdBy:myId||null}), `Đã quyết định làm ${l.ma}, kho đã trừ`);
  lenhFilter="qd"; render();
}

/* ---------- render ---------- */
function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === view)));
  const tinh = canDoi();
  const nCanh = khoList().filter(k => { const [, c] = trangThaiKho(k, tinh[k.id]); return c !== "p-ok"; }).length;
  const kb = $('#tabs [data-v="kho"]'); kb.innerHTML = "Kho nguyên liệu" + (nCanh ? `<span class="badge-n">${nCanh}</span>` : "");
  const m = $("#main");
  const ready = Object.values(S.ready).every(Boolean);
  if (!db) { m.innerHTML = `<div class="empty"><b>Chưa kết nối được kho dữ liệu chung</b>Hãy mở trang này khi đã đăng nhập Claude và được chia sẻ quyền truy cập.</div>`; return; }
  if (!ready) { m.innerHTML = `<div class="empty"><b>Đang tải dữ liệu…</b></div>`; return; }
  const ro = canWrite ? "" : `<div class="banner">Bạn đang ở chế độ <b>chỉ xem</b>. Muốn nhập liệu, nhờ Quản lý cấp quyền Nhập liệu.</div>`;
  m.innerHTML = ro + ({tong:vTong, lenh:vLenh, sp:vSp, kho:vKho, nhap:vNhap}[view])(tinh);
  bindView(tinh);
  resolveNames();
}

function vTong(tinh) {
  const L = lenhList();
  const thu = L.filter(l => l.trangthai==="thu"), qd = L.filter(l=>l.trangthai==="qd");
  const K = khoList();
  const thieu = K.filter(k => tinh[k.id].canMua > 0 || tinh[k.id].ton < 0);
  const sap = K.filter(k => { const c = tinh[k.id]; return c.ton >= 0 && c.canMua <= 0 && c.ton <= (+k.tonMin||0); });
  const tq = tongQ.trim();
  const rows = tq ? K.filter(k => matchAll(k.ten+" "+(k.ma||"")+" "+(k.loai||""), tq))
    : K.filter(k => { const c = tinh[k.id]; return c.thu > 0 || c.xuat > 0 || c.ton < (+k.tonMin||0) || c.ton < 0; });
  const rowsS = xepThieu(rows, k => mucKho(k, tinh[k.id]));
  const thieuV = tq ? thieu.filter(k => matchAll(k.ten+" "+(k.ma||""), tq)) : thieu;
  return `<section class="view">
  <div class="head"><div><h2>Tổng quan</h2><p>Tình hình nguyên liệu theo các lệnh đang thử và đã quyết định làm.</p></div>
    <div class="bar"><button class="btn primary" data-a="new-lenh">+ Lên thử đơn</button><button class="btn soil" data-a="new-nhap">+ Nhập kho</button></div></div>
  <div class="kpis">
    <button class="kpi info" data-go="lenh" data-f="thu"><b>${thu.length}</b><span>Lệnh đang thử đơn</span></button>
    <button class="kpi" data-go="lenh" data-f="qd"><b>${qd.length}</b><span>Lệnh đã quyết định làm</span></button>
    <button class="kpi ${thieu.length?"bad":""}" data-go="kho"><b>${thieu.length}</b><span>Nguyên liệu thiếu / âm kho</span></button>
    <button class="kpi ${sap.length?"warn":""}" data-go="kho"><b>${sap.length}</b><span>Nguyên liệu sắp hết</span></button>
  </div>
  <div class="bar"><input type="search" id="tongq" placeholder="Tìm nguyên liệu, VD: boric, amino 80, nhan…" value="${esc(tongQ)}" aria-label="Tìm trong tổng quan"><span class="hint">${tq ? `Đang hiện ${rows.length} nguyên liệu khớp “${esc(tq)}”, kể cả nguyên liệu chưa dùng.` : "Gõ để tra nhanh tồn kho và nhu cầu của bất kỳ nguyên liệu nào."}</span></div>
  <div class="panel"><h3>Bảng tổng kết nguyên liệu <small>${tq ? "Kết quả tìm kiếm" : "Nguyên liệu thiếu (đỏ) và sắp hết (cam) tự xếp lên đầu"}</small></h3>
  ${rows.length ? `<div class="tbl-wrap"><table><thead><tr><th>Nguyên liệu / Bao bì</th><th>ĐV</th><th class="n">Cần cho đơn thử</th><th class="n">Đã xuất SX</th><th class="n">Tồn hiện tại</th><th class="n">Còn lại nếu làm hết</th><th class="n">Cần mua thêm</th><th>Tình trạng</th></tr></thead><tbody>
  ${rowsS.map(k => { const c = tinh[k.id]; const [t,cl] = trangThaiKho(k,c); return `<tr class="click ${lopMuc(mucKho(k,c))}" data-the="${k.id}"><td>${hilite(k.ten,tq)}</td><td class="mut">${esc(k.donvi)}</td><td class="n">${fmt(c.thu)}</td><td class="n">${fmt(c.xuat)}</td><td class="n"><b>${fmt(c.ton)}</b></td><td class="n ${c.conLai<0?"neg":""}">${fmt(c.conLai)}</td><td class="n ${c.canMua>0?"neg":""}">${c.canMua>0?fmt(c.canMua):"–"}</td><td><span class="pill ${cl}">${t}</span></td></tr>`; }).join("")}
  </tbody></table></div>` : tq ? `<div class="empty"><b>Không tìm thấy nguyên liệu khớp “${esc(tq)}”</b>Thử gõ ít chữ hơn.</div>` : `<div class="empty"><b>Chưa có lệnh sản xuất nào</b>Tạo lệnh “Lên thử đơn” để xem cần bao nhiêu nguyên liệu.</div>`}
  </div>
  ${thieuV.length ? `<div class="panel"><h3>Danh sách cần mua <small>Để làm hết các đơn đang thử</small></h3><div class="tbl-wrap"><table><thead><tr><th>Nguyên liệu</th><th class="n">Cần mua</th><th>ĐV</th><th class="n">Giá TB gần nhất</th><th class="n">Ước tính</th></tr></thead><tbody>
  ${thieuV.map(k => { const c=tinh[k.id]; const q=Math.max(c.canMua,-c.ton); return `<tr><td>${hilite(k.ten,tq)}</td><td class="n neg">${fmt(q)}</td><td class="mut">${esc(k.donvi)}</td><td class="n">${c.giaTB?money(c.giaTB):"–"}</td><td class="n">${c.giaTB?money(c.giaTB*q):"–"}</td></tr>`; }).join("")}
  </tbody></table></div></div>` : ""}
</section>`;
}

function lenhMatch(l) {
  const ds = [l.ngay, l.qdNgay].filter(Boolean).map(s => String(s).slice(0,10));
  if (lenhFrom && !ds.some(d => d >= lenhFrom)) return false;
  if (lenhTo && !ds.some(d => d <= lenhTo)) return false;
  if ((lenhFrom || lenhTo) && !ds.some(d => (!lenhFrom || d >= lenhFrom) && (!lenhTo || d <= lenhTo))) return false;
  const q = lenhQ.trim().replace(/[-.]/g, "/"); if (!q) return true;
  const dv = ds.map(d => { const [y,m,dd] = d.split("-"); return `${dd}/${m}/${y} ${+dd}/${+m}/${y} ${dd}/${m} ${+dd}/${+m} ${m}/${y} ${+m}/${y}`; }).join(" ");
  const sp = S.sp[l.spId];
  return matchAll([l.ma, l.spTen, sp?.ten, sp?.quycach, l.ghichu, ORD[l.trangthai], dv].filter(Boolean).join(" "), q);
}
function vLenh(tinh) {
  const base = lenhList().filter(lenhMatch);
  const L = base.filter(l => lenhFilter==="all" || l.trangthai===lenhFilter);
  const cnt = s => base.filter(l=>l.trangthai===s).length;
  const active = lenhQ.trim() || lenhFrom || lenhTo;
  return `<section class="view">
  <div class="head"><div><h2>Lệnh sản xuất</h2><p><b>Lên thử đơn</b> chỉ tính toán, không trừ kho. <b>Quyết định làm</b> sẽ chốt số nguyên liệu và trừ khỏi kho ngay.</p></div>
  <button class="btn primary" data-a="new-lenh">+ Tạo lệnh mới</button></div>
  <div class="bar" style="align-items:flex-end">
    <label class="f" style="flex:1 1 240px;max-width:360px">Tìm lệnh<input type="search" id="lenhq" placeholder="Mã, sản phẩm, ghi chú hoặc ngày, VD: 12/10" value="${esc(lenhQ)}"></label>
    <label class="f" style="flex:0 1 160px">Từ ngày<input type="date" id="lenh-from" value="${esc(lenhFrom)}"></label>
    <label class="f" style="flex:0 1 160px">Đến ngày<input type="date" id="lenh-to" value="${esc(lenhTo)}"></label>
    <div class="chips"><button class="chip" data-range="today">Hôm nay</button><button class="chip" data-range="7">7 ngày</button><button class="chip" data-range="month">Tháng này</button>${active?`<button class="chip" data-range="clear">× Xóa lọc</button>`:""}</div>
  </div>
  ${active ? `<p class="hint" style="margin:-6px 0 0">Tìm thấy <b>${base.length}</b> lệnh${lenhFrom||lenhTo?` từ ${lenhFrom?dshow(lenhFrom):"đầu"} đến ${lenhTo?dshow(lenhTo):"nay"}`:""}${lenhQ.trim()?` khớp “${esc(lenhQ.trim())}”`:""}. Ngày tính theo ngày lập lệnh hoặc ngày quyết định làm.</p>` : ""}
  <div class="chips">${[["thu",`Đang thử đơn (${cnt("thu")})`],["qd",`Đã quyết định (${cnt("qd")})`],["huy",`Đã hủy (${cnt("huy")})`],["all","Tất cả"]].map(([k,t])=>`<button class="chip" data-lf="${k}" aria-pressed="${lenhFilter===k}">${t}</button>`).join("")}</div>
  <div class="cards">${L.length ? L.map(l => ordCard(l, tinh)).join("") : (active ? `<div class="panel empty"><b>Không có lệnh nào khớp bộ lọc ở mục này</b>Thử chọn “Tất cả” hoặc bấm “× Xóa lọc”.</div>` : `<div class="panel empty"><b>Không có lệnh nào ở mục này</b>Bấm “Tạo lệnh mới” để lên thử đơn.</div>`)}</div>
</section>`;
}
function ordCard(l, tinh) {
  const sp = S.sp[l.spId];
  const cls = {thu:"s-thu",qd:"s-qd",huy:"s-huy"}[l.trangthai] || "";
  const pill = {thu:'<span class="pill p-info">Lên thử đơn</span>', qd:'<span class="pill p-acc">Quyết định làm</span>', huy:'<span class="pill p-mute">Đã hủy</span>'}[l.trangthai];
  let check = "", detail = "";
  if (l.trangthai === "thu") {
    if (!sp) { check = `<span class="pill p-bad">Sản phẩm đã bị xóa</span>`; detail = `<p class="hint">Sản phẩm đã bị xóa.</p>`; }
    else { const pt = phanTich(l.spId, l.soluong, tinh, l.id); const kl = ketLuan(pt);
      check = pt.length ? `<span class="pill ${PILL[kl.lv]}" title="${esc(kl.txt)}">${kl.pill}</span>` : `<span class="pill p-bad">Chưa có công thức</span>`;
      detail = pt.length ? `${kl.lv!=="ok"?`<p class="hint" style="color:var(--${kl.lv==="bad"?"bad":"warn"})">${esc(kl.txt)}.</p>`:""}${bangPT(pt)}` : `<p class="hint">Sản phẩm chưa có công thức.</p>`; }
  } else {
    const rows = l.tieuthu || [];
    detail = rows.length ? `<p class="hint">Số đã chốt lúc quyết định làm${l.qdNgay?` (${dshow(l.qdNgay)})`:""}. Sửa công thức sau này không làm thay đổi số này.</p><div class="tbl-wrap"><table><thead><tr><th>Nguyên liệu</th><th class="n">${l.trangthai==="qd"?"Đã trừ kho":"Đã hoàn kho"}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.ten)}</td><td class="n">${fmt(r.luong)} <span class="mut">${esc(r.donvi)}</span></td></tr>`).join("")}</tbody></table></div>` : `<p class="hint">Lệnh này chưa từng trừ kho.</p>`;
  }
  let acts = "";
  if (canWrite) {
    if (pendingConfirm?.id === l.id) {
      const msg = pendingConfirm.kind === "qd-warn" ? `Làm lệnh này sẽ khiến ${esc(pendingConfirm.lenhKhac.join(", "))} thiếu nguyên liệu. Vẫn quyết định làm?` : pendingConfirm.kind === "huy-qd" ? "Hủy lệnh này và hoàn nguyên liệu lại vào kho?" : pendingConfirm.kind === "xoa" ? "Xóa hẳn lệnh này?" : "Hủy lệnh thử này?";
      acts = `<div class="confirm">${msg}<button class="btn sm danger solid" data-a="confirm-yes" data-id="${l.id}">Đồng ý</button><button class="btn sm" data-a="confirm-no">Không</button></div>`;
    } else if (l.trangthai === "thu") acts = `<button class="btn sm primary" data-a="qd" data-id="${l.id}">Quyết định làm</button><button class="btn sm" data-a="edit-lenh" data-id="${l.id}">Sửa</button><button class="btn sm danger" data-a="ask" data-k="huy-thu" data-id="${l.id}">Hủy</button>`;
    else if (l.trangthai === "qd") acts = `<button class="btn sm danger" data-a="ask" data-k="huy-qd" data-id="${l.id}">Hủy & hoàn kho</button>`;
    else acts = `<button class="btn sm" data-a="restore" data-id="${l.id}">Khôi phục về thử đơn</button><button class="btn sm danger" data-a="ask" data-k="xoa" data-id="${l.id}">Xóa</button>`;
    if (pendingConfirm?.id !== l.id) acts += `<button class="btn sm" data-a="copy-lenh" data-id="${l.id}" title="Tạo lệnh mới giống lệnh này">Sao chép</button>`;
  }
  const qc = sp ? `${sp.quycach||""}` : "";
  return `<article class="ord ${cls}">
    <div class="ord-top"><div class="t"><small><span class="code">${esc(l.ma)}</span> · ${dshow(l.ngay)}${l.by?` · <span data-name="${esc(l.by)}"></span>`:""}</small>
      <b>${esc(l.spTen || sp?.ten || "?")} — ${fmt(l.soluong)} ${esc(sp?.donviTP || "thành phẩm")}</b>
      ${qc||l.ghichu?`<small>${esc(qc)}${qc&&l.ghichu?" · ":""}${esc(l.ghichu||"")}</small>`:""}</div>
      <div class="ord-acts">${pill}${check}</div></div>
    <details><summary>Xem nguyên liệu</summary>${detail}</details>
    ${acts?`<div class="ord-acts">${acts}</div>`:""}
  </article>`;
}

function vSp(tinh) {
  const all = spList(), q = spQ.trim();
  const P = !q ? all : all.map(p => {
      const nls = (p.congthuc||[]).filter(r=>S.kho[r.nlId]).map(r=>S.kho[r.nlId].ten).join(" ");
      if (matchAll(p.ten+" "+(p.quycach||""), q)) return [0,p];
      if (matchAll(p.ten+" "+(p.quycach||"")+" "+nls, q)) return [1,p];
      return null;
    }).filter(Boolean).sort((a,b)=>a[0]-b[0] || sortVi(a[1].ten,b[1].ten)).map(x=>x[1]);
  return `<section class="view">
  <div class="head"><div><h2>Công thức sản phẩm</h2><p>Mỗi công thức tính cho <b>1 thành phẩm</b> (1 chai, 1 gói, 1 hũ). Chai, nắp, nhãn, hũ cũng khai báo như một nguyên liệu.</p></div>
  <button class="btn primary" data-a="new-sp">+ Thêm sản phẩm</button></div>
  ${all.length ? `<div class="bar"><input type="search" id="spq" placeholder="Tìm công thức, VD: 10 60 10, amino, hop 1kg, boric…" value="${esc(spQ)}" aria-label="Tìm công thức"><span class="hint">${q ? `Tìm thấy ${P.length} / ${all.length} công thức. Gõ tên nguyên liệu để tìm các công thức đang dùng nguyên liệu đó.` : `${all.length} công thức`}</span></div>` : ""}
  ${P.length ? `<div class="prods">${P.map(p => { const g = giaVon(p,tinh); const ct = (p.congthuc||[]).filter(r=>S.kho[r.nlId]);
    return `<div class="prod"><div class="ph"><div><b>${hilite(p.ten,q)}</b><small>${hilite(p.quycach||"",q)}</small></div>${canWrite?`<div class="ord-acts" style="flex-wrap:nowrap"><button class="btn sm" data-a="copy-sp" data-id="${p.id}" title="Tạo công thức mới giống công thức này">Sao chép</button><button class="btn sm" data-a="edit-sp" data-id="${p.id}">Sửa</button></div>`:""}</div>
    <ul>${ct.length?ct.map(r=>`<li><span>${hilite(S.kho[r.nlId].ten,q)}</span><span>${fmt(r.luong)} ${esc(S.kho[r.nlId].donvi)}</span></li>`).join(""):`<li class="mut">Chưa có nguyên liệu</li>`}</ul>
    <div class="pf"><span>Giá vốn NL / 1 ${esc(p.donviTP||"TP")}</span><b>${g.v?money(g.v):"–"}${g.v&&!g.du?" *":""}</b></div></div>`; }).join("")}</div>
    <p class="hint">Giá vốn tính theo đơn giá nhập bình quân. Dấu * nghĩa là có nguyên liệu chưa có đơn giá.</p>`
  : all.length ? `<div class="panel empty"><b>Không tìm thấy công thức nào khớp “${esc(q)}”</b>Thử gõ ít chữ hơn, ví dụ chỉ “amino” hoặc “10 60”.</div>`
  : `<div class="panel empty"><b>Chưa có sản phẩm nào</b>Khai báo nguyên liệu ở tab Kho trước, rồi thêm sản phẩm và công thức.</div>`}
</section>`;
}

function vKho(tinh) {
  const q = khoQ.trim().toLowerCase();
  const K = xepThieu(khoList().filter(k => !q || matchAll(k.ten+" "+(k.ma||"")+" "+(k.loai||""), q)), k => mucKho(k, tinh[k.id]));
  return `<section class="view">
  <div class="head"><div><h2>Kho nguyên liệu & bao bì</h2><p>Tồn hiện tại = Tồn đầu kỳ + Tổng nhập − Đã xuất cho lệnh “Quyết định làm”. Nguyên liệu thiếu (đỏ) và sắp hết (cam) tự xếp lên đầu. Bấm vào một dòng để xem thẻ kho.</p></div>

/* ---------- ô tìm kiếm thông minh (không dấu, gõ phần bất kỳ) ---------- */
const norm = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[đĐ]/g,"d").toLowerCase();
const tokens = q => norm(q).split(/[\s,]+/).filter(Boolean);
const has = (H, t) => H.includes(t) || H.replace(/\s+/g,"").includes(t);
const matchAll = (text, q) => { const H = norm(text); return tokens(q).every(t => has(H, t)); };
function pickItems(kind) {
  return kind === "sp" ? spList().map(p => ({id:p.id, label:p.ten, sub:p.quycach||""}))
    : khoList().map(k => ({id:k.id, label:k.ten, sub:[k.ma, k.donvi].filter(Boolean).join(" · ")}));
}
function pickHTML(kind, value, attrs) {
  const it = pickItems(kind).find(x => x.id === value);
  const ph = kind === "sp" ? "Gõ để tìm sản phẩm…" : "Gõ 2–3 chữ để tìm, VD: thio, amino 80";
  return `<div class="pick" data-kind="${kind}"><input type="text" class="pick-in" autocomplete="off" spellcheck="false" placeholder="${ph}" value="${esc(it?.label||"")}" role="combobox" aria-autocomplete="list" aria-expanded="false"><div class="pick-ls" role="listbox" hidden></div><input type="hidden" ${attrs} value="${esc(value||"")}"></div>`;
}
function hilite(label, q) {
  const ts = tokens(q); if (!ts.length) return esc(label);
  const N = norm(label); const mark = new Array(label.length).fill(false);
  for (const t of ts) { let i = N.indexOf(t); while (i >= 0) { for (let j=i;j<i+t.length;j++) mark[j]=true; i = N.indexOf(t, i+1); } }
  let out = "", on = false;
  for (let i=0;i<label.length;i++) { if (mark[i]!==on) { out += mark[i] ? "<b>" : "</b>"; on = mark[i]; } out += esc(label[i]); }
  return out + (on ? "</b>" : "");
}
function pickFilter(q, items) {
  const ts = tokens(q); if (!ts.length) return items;
  const r = [];
  for (const it of items) {
    if (!ts.every(t => has(norm(it.label)+" "+norm(it.sub), t))) continue;
    const L = norm(it.label);
    const s = L.startsWith(ts[0]) ? 0 : (" "+L).includes(" "+ts[0]) ? 1 : 2;
    r.push([s, it]);
  }
  return r.sort((a,b) => a[0]-b[0] || sortVi(a[1].label, b[1].label)).map(x => x[1]);
}
function pickOpen(pk, q) {
  const ls = pk.querySelector(".pick-ls"); const items = pickFilter(q, pickItems(pk.dataset.kind));
  const cur = pk.querySelector("input[type=hidden]").value;
  let on = q ? 0 : Math.max(0, items.findIndex(x => x.id === cur));
  ls.innerHTML = items.length ? items.slice(0, 80).map((it,i) => `<div class="pick-op ${i===on?"on":""}" role="option" data-id="${it.id}"><span>${hilite(it.label, q)}</span><small>${esc(it.sub)}</small></div>`).join("")
    : `<div class="pick-no">${pickItems(pk.dataset.kind).length ? `Không tìm thấy “${esc(q)}”. Thử gõ ít chữ hơn.` : "Danh sách đang trống."}</div>`;
  ls.hidden = false; pk.querySelector(".pick-in").setAttribute("aria-expanded","true");
  ls.querySelector(".on")?.scrollIntoView({block:"nearest"});
}
function pickClose(pk) {
  const ls = pk.querySelector(".pick-ls"); if (!ls) return; ls.hidden = true;
  pk.querySelector(".pick-in").setAttribute("aria-expanded","false");
  const it = pickItems(pk.dataset.kind).find(x => x.id === pk.querySelector("input[type=hidden]").value);
  pk.querySelector(".pick-in").value = it?.label || "";
}
function pickSet(pk, id) {
  const h = pk.querySelector("input[type=hidden]"); h.value = id; pickClose(pk);
  h.dispatchEvent(new Event("input", {bubbles:true})); h.dispatchEvent(new Event("change", {bubbles:true}));
}
function pickReset(pk) { pk.querySelector("input[type=hidden]").value = ""; pk.querySelector(".pick-in").value = ""; }
document.addEventListener("focusin", e => { if (e.target.classList?.contains("pick-in")) { e.target.select(); pickOpen(e.target.closest(".pick"), ""); } });
document.addEventListener("input", e => { if (e.target.classList?.contains("pick-in")) pickOpen(e.target.closest(".pick"), e.target.value); });
document.addEventListener("focusout", e => { if (e.target.classList?.contains("pick-in")) { const pk = e.target.closest(".pick"); setTimeout(() => { if (!pk.contains(document.activeElement)) pickClose(pk); }, 120); } });
document.addEventListener("mousedown", e => { if (e.target.closest(".pick-ls")) e.preventDefault(); });
document.addEventListener("click", e => {
  if (!e.target.closest(".pick-ls")) return; e.preventDefault();
  const op = e.target.closest(".pick-op"); if (op) pickSet(e.target.closest(".pick"), op.dataset.id);
});
document.addEventListener("keydown", e => {
  if (!e.target.classList?.contains("pick-in")) return;
  const pk = e.target.closest(".pick"), ls = pk.querySelector(".pick-ls");
  const ops = [...ls.querySelectorAll(".pick-op")]; let i = ops.findIndex(o => o.classList.contains("on"));
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (ls.hidden) return pickOpen(pk, e.target.value);
    if (!ops.length) return; ops[i]?.classList.remove("on");
    i = e.key === "ArrowDown" ? Math.min(ops.length-1, i+1) : Math.max(0, i-1);
    ops[i].classList.add("on"); ops[i].scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter") {
    if (!ls.hidden && ops[i]) { e.preventDefault(); pickSet(pk, ops[i].dataset.id); }
  } else if (e.key === "Tab") {
    if (!ls.hidden && ops[i] && e.target.value.trim()) pickSet(pk, ops[i].dataset.id);
  } else if (e.key === "Escape") {
    if (!ls.hidden) { e.preventDefault(); e.stopPropagation(); pickClose(pk); }
  }
}, true);

/* ---------- modal ---------- */
function modal(title, body, foot, wide) {
  $("#layer").innerHTML = `<div class="ov" id="ov"><div class="md ${wide?"wide":""}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3>${esc(title)}</h3><button class="x" data-close aria-label="Đóng">×</button></header><div class="bd">${body}</div>${foot?`<footer>${foot}</footer>`:""}</div></div>`;
  const ov = $("#ov");
  ov.addEventListener("click", e => { if (e.target === ov || e.target.closest("[data-close]")) closeModal(); });
  setTimeout(() => ov.querySelector("input:not([type=hidden]),select")?.focus(), 30);
  return ov;
}
const closeModal = () => { $("#layer").innerHTML = ""; };
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#ov")) closeModal(); });
const showErr = (ov, msg) => { let e = ov.querySelector(".err"); if (!e) { e = document.createElement("div"); e.className="err"; ov.querySelector(".bd").prepend(e); } e.textContent = msg; };

const optsSp = sel => `<option value="">— Chọn sản phẩm —</option>` + spList().map(p=>`<option value="${p.id}" ${p.id===sel?"selected":""}>${esc(p.ten)}${p.quycach?" · "+esc(p.quycach):""}</option>`).join("");

function nextMa(prefix, list) {

  return prefix + String(mx+1).padStart(3,"0");
}

function usedBy(id) {

}

function copyName(ten) {
  const base = String(ten||"").replace(/ \(bản sao( \d+)?\)$/,"");
  const taken = new Set(spList().map(x=>x.ten.trim().toLowerCase()));
  let n = base + " (bản sao)", i = 2;
  while (taken.has(n.toLowerCase())) n = `${base} (bản sao ${i++})`;
  return n;
}
function mSp(id, srcId) {

  let rows = (p.congthuc||[]).map(r=>({...r}));
  if (!rows.length) rows.push({nlId:"",luong:""});
  const decided = id && Object.values(S.lenh).some(l=>l.spId===id && l.trangthai==="qd");

    <div class="grid2"><label class="f">Tên sản phẩm<input id="s-ten" value="${esc(p.ten||"")}" placeholder="VD: Kích rễ AnviFa"></label>

    ${decided ? `<p class="hint">Sản phẩm này đã có lệnh “Quyết định làm”. Sửa công thức chỉ áp dụng cho lệnh mới, số đã trừ kho của lệnh cũ giữ nguyên.</p>` : ""}`,
    `${id?`<button class="btn danger" data-a="del-sp" style="margin-right:auto">Xóa sản phẩm</button><button class="btn" data-a="copy-from-edit">Sao chép thành công thức mới</button>`:""}<button class="btn" data-close>Đóng</button><button class="btn primary" data-a="save-sp">Lưu công thức</button>`, true);

    if (a==="del-sp") {

    }
  });

  if (a==="new-lenh") mLenh(); if (a==="edit-lenh") mLenh(id); if (a==="copy-lenh") mLenh(null, id);
  if (a==="new-sp") mSp(); if (a==="edit-sp") mSp(id); if (a==="copy-sp") mSp(null, id);

  if (a==="ask-nhap") { pendingConfirm={id,kind:"nhap"}; render(); }
  if (a==="confirm-no") { pendingConfirm=null; render(); }
  if (a==="del-nhap") { pendingConfirm=null; await write(()=>db.doc("nhap/"+id).delete(),"Đã xóa phiếu nhập"); }
  if (a==="confirm-yes") {
    const k=pendingConfirm?.kind; pendingConfirm=null; const l=S.lenh[id];
    if (k==="qd-warn") { const th=kiemTra(l.spId,l.soluong,canDoi()); if (th.length) { toast("Kho đã thay đổi, không còn đủ nguyên liệu."); render(); return; } await doQd(id); return; }
    else if (k==="huy-qd") await write(()=>db.doc("lenh/"+id).update({trangthai:"huy", huyNgay:today(), huyBy:myId||null}), `Đã hủy ${l.ma}, nguyên liệu đã hoàn kho`);
    else if (k==="huy-thu") await write(()=>db.doc("lenh/"+id).update({trangthai:"huy", tieuthu:[], huyNgay:today(), huyBy:myId||null}), `Đã hủy ${l.ma}`);
    else if (k==="xoa") await write(()=>db.doc("lenh/"+id).delete(), `Đã xóa ${l.ma}`);
    render();
  }
  if (a==="restore") await write(()=>db.doc("lenh/"+id).update({trangthai:"thu", tieuthu:[]}), "Đã đưa lệnh về thử đơn");
  if (a==="qd") {
    const l=S.lenh[id]; const th=kiemTra(l.spId,l.soluong,canDoi());
    if (!S.sp[l.spId]) return toast("Sản phẩm của lệnh này đã bị xóa.");
    if (th.length) { toast(`Không đủ nguyên liệu: ${th.map(x=>x.ten).join(", ")}`); return; }
    const kl = ketLuan(phanTich(l.spId, l.soluong, canDoi(), id));
    if (kl.lv === "warn") { pendingConfirm = {id, kind:"qd-warn", lenhKhac:kl.lenhKhac}; render(); return; }
    await doQd(id);
  }
});

/* lớp db giữ đúng cách gọi cũ: db.collection(c).onSnapshot/add, db.doc("c/id").set/update/delete */
const clean = d => JSON.parse(JSON.stringify(d));
function makeDb(){
  return {
    collection: c => ({
      onSnapshot(fn, err){ const u = F.onSnapshot(F.collection(fdb, PREFIX+c), s => fn({docs:s.docs.map(d=>({id:d.id, data:()=>d.data()}))}), err); unsubs.push(u); return u; },
      async add(d){ const r = await F.addDoc(F.collection(fdb, PREFIX+c), clean(d)); return {id:r.id}; }
    }),
    doc: path => { const [c,id] = path.split("/"); const ref = F.doc(fdb, PREFIX+c, id); return {
      set: d => F.setDoc(ref, clean(d)),
      update: d => F.updateDoc(ref, clean(d)),
      delete: () => F.deleteDoc(ref) }; }
  };
}
const fbErr = e => {
  const c = e?.code || "";
  if (c === "permission-denied") return { code: canWrite ? "rules" : "invalid_argument" };
  if (c === "resource-exhausted") return { code: "quota_exceeded" };
  return e;
};
const _write = write;
write = async (fn, ok) => {
  try { await fn(); if (ok) toast(ok); return true; }
  catch (e0) {
    const e = fbErr(e0);
    if (e?.code === "rules") { toast("Firebase không cho phép ghi. Kiểm tra quyền tài khoản hoặc luật Firestore."); console.error(e0); return false; }
    return _write(() => { throw e; }, ok);
  }
};
U = { async profiles(ids){ const o={}; for (const i of ids) o[i] = {name: profiles[i]?.name || i}; return o; } };

async function restoreFrom(o){
  const ops=[];
  for(const c of COLS){
    const src=o.data[c]||{};
    for(const [id,d] of Object.entries(src)) ops.push(()=>db.doc(c+"/"+id).set(d));
    for(const id of Object.keys(S[c])) if(!(id in src)) ops.push(()=>db.doc(c+"/"+id).delete());
  }
  for(let i=0;i<ops.length;i+=20) await Promise.all(ops.slice(i,i+20).map(f=>f()));
  return ops.length;
}
function mData(){
  const n=COLS.reduce((s,c)=>s+Object.keys(S[c]).length,0);
  const ov=modal("Dữ liệu & sao lưu",`
    <p class="hint">Dữ liệu lưu chung trên Firebase: mọi người được cấp quyền đều thấy cùng một số liệu, mở trên máy tính hay điện thoại. Vẫn nên <b>tải file sao lưu mỗi tuần</b> để cất riêng.</p>
    <div class="panel"><h3>Sao lưu <small>${n} bản ghi đang có</small></h3><div class="bd" style="padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn primary" data-a="bk">Tải file sao lưu (.json)</button>
      ${isAdmin?`<button class="btn" data-a="rs">Khôi phục / nạp từ file sao lưu</button>`:""}
      <input type="file" id="rs-file" accept=".json,application/json" hidden></div></div>
    <div class="panel"><h3>Báo cáo</h3><div style="padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn soil" data-a="xl">Xuất Excel (tồn kho, lệnh, phiếu nhập, công thức)</button></div></div>`,
    `<button class="btn" data-close>Đóng</button>`);
  ov.addEventListener("click",e=>{
    const t=e.target.closest("[data-a]"); if(!t) return; const a=t.dataset.a;
    if(a==="bk") doBackup();
    if(a==="xl") doExcel();
    if(a==="rs"){ if(n && t.dataset.sure!=="1"){t.dataset.sure="1";t.textContent="Bấm lần nữa: dữ liệu chung sẽ bị thay bằng file sao lưu";t.classList.add("danger");return;} $("#rs-file").click(); }
  });
  $("#rs-file").addEventListener("change",async e=>{
    const f=e.target.files[0]; if(!f) return;
    let o; try{ o=JSON.parse(await f.text()); if(o.app!=="keps-kho"||!o.data) throw 0; }catch{ showErr(ov,"File này không phải file sao lưu của phần mềm kho TNP."); return; }
    toast("Đang nạp dữ liệu…");
    const ok=await write(()=>restoreFrom(o)); if(ok){ closeModal(); toast(`Đã nạp dữ liệu sao lưu ngày ${new Date(o.luc).toLocaleDateString("vi-VN")}`); }
  });
}
function mPerm(){
  const list = Object.values(profiles).filter(p=>p.email!==emailKey(ADMIN_EMAIL)).sort((a,b)=>sortVi(a.name||a.email,b.name||b.email));
  const opt = v => Object.entries(QUYEN).map(([k,l])=>`<option value="${k}" ${v===k?"selected":""}>${l}</option>`).join("");
  const ov = modal("Tài khoản Kho TNP", `
    <div class="panel"><h3>Tạo tài khoản mới</h3><div class="bd" style="padding:14px 16px;display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">
      <label>Họ tên<input id="nu-ten" style="width:100%"></label>
      <label>Email<input id="nu-em" type="email" style="width:100%"></label>
      <label>Mật khẩu (≥ 6 ký tự)<input id="nu-pw" style="width:100%"></label>
      <label>Quyền<select id="nu-q" style="width:100%">${opt("ghi")}</select></label>
      <div style="align-self:end"><button class="btn primary" data-a="nu">Tạo tài khoản</button></div></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Người dùng</th><th>Quyền</th><th>Trạng thái</th></tr></thead><tbody>
    <tr><td><b>${esc(profiles[emailKey(ADMIN_EMAIL)]?.name||"Quản lý")}</b><br><span class="mut">${esc(emailKey(ADMIN_EMAIL))}</span></td><td>Quản lý gốc</td><td>Luôn hoạt động</td></tr>
    ${list.map(p=>`<tr><td><b>${esc(p.name||p.email)}</b><br><span class="mut">${esc(p.email)}</span></td><td><select data-em="${esc(p.email)}" data-f="quyen">${opt(p.quyen||"xem")}</select></td>
      <td><button class="btn sm ${p.active===false?"":"danger"}" data-a="lock" data-em="${esc(p.email)}">${p.active===false?"Mở khóa":"Khóa"}</button></td></tr>`).join("")}
    </tbody></table></div>
    <p class="hint">Nhân viên quên mật khẩu: bấm “Quên mật khẩu” ở màn hình đăng nhập, Firebase sẽ gửi email đặt lại.</p>`, `<button class="btn" data-close>Đóng</button>`, true);
  const save = async (em, patch, msg) => { try { await F.setDoc(F.doc(fdb,USERS,em), patch, {merge:true}); toast(msg); } catch(err){ console.error(err); toast("Chưa lưu được: "+(err.code||err.message)); } };
  ov.addEventListener("change", e => { const s=e.target.closest("select[data-em]"); if (s) save(s.dataset.em, {quyen:s.value}, "Đã lưu quyền"); });
  ov.addEventListener("click", async e => {
    const t=e.target.closest("[data-a]"); if(!t) return;
    if (t.dataset.a==="lock") { const p=profiles[t.dataset.em]; await save(t.dataset.em, {active: p.active===false}, p.active===false?"Đã mở khóa":"Đã khóa tài khoản"); closeModal(); setTimeout(mPerm,200); }
    if (t.dataset.a==="nu") {
      const ten=$("#nu-ten").value.trim(), em=emailKey($("#nu-em").value), pw=$("#nu-pw").value, q=$("#nu-q").value;
      if (!ten||!em||pw.length<6) return showErr(ov,"Nhập đủ họ tên, email và mật khẩu từ 6 ký tự.");
      t.disabled=true; t.textContent="Đang tạo…";
      const sec = appM.initializeApp(firebaseConfig, "tao-"+Date.now());
      try { const sa=A.getAuth(sec); await A.createUserWithEmailAndPassword(sa, em, pw); try{await A.signOut(sa);}catch{} }
      catch(err){ t.disabled=false; t.textContent="Tạo tài khoản"; try{await appM.deleteApp(sec);}catch{}
        if (err.code!=="auth/email-already-in-use") return showErr(ov, err.code==="auth/invalid-email"?"Email không hợp lệ.":err.code==="auth/weak-password"?"Mật khẩu quá yếu.":"Chưa tạo được: "+(err.code||err.message)); }
      try{await appM.deleteApp(sec);}catch{}
      await save(em, {email:em, name:ten, quyen:q, active:true}, `Đã tạo tài khoản ${em}`);
      closeModal(); setTimeout(mPerm,200);
    }
  });
}
function mPw(){

    <label>Mật khẩu hiện tại<input type="password" id="pw-old" style="width:100%"></label>
    <label>Mật khẩu mới (≥ 6 ký tự)<input type="password" id="pw-new" style="width:100%"></label></div>`,

    try { const u=auth.currentUser; await A.reauthenticateWithCredential(u, A.EmailAuthProvider.credential(u.email,o)); await A.updatePassword(u,n); closeModal(); toast("Đã đổi mật khẩu"); }
    catch(err){ showErr(ov, err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"?"Mật khẩu hiện tại không đúng.":"Chưa đổi được: "+(err.code||err.message)); } });
}

/* ---------- đăng nhập ---------- */
function showLogin(msg){
  for (const u of unsubs) try{u();}catch{} unsubs=[]; db=null; me=null;
  for (const c of COLS) { S[c]={}; S.ready[c]=0; }
  backupInfo();
  $("#main").innerHTML = `<div class="panel" style="max-width:400px;margin:40px auto"><h3>Đăng nhập Kho TNP</h3><form class="bd" id="lg" style="padding:16px;display:grid;gap:10px">
    <p class="hint" style="margin:0">Dùng email & mật khẩu do Quản lý cấp.</p>
    ${msg?`<div class="err">${esc(msg)}</div>`:""}
    <label>Email<input type="email" id="lg-em" required autocomplete="username" style="width:100%"></label>
    <label>Mật khẩu<input type="password" id="lg-pw" required autocomplete="current-password" style="width:100%"></label>
    <button class="btn primary" type="submit">Đăng nhập</button>
    <button class="btn sm" type="button" id="lg-fg">Quên mật khẩu</button></form></div>`;
  $("#lg").onsubmit = async e => { e.preventDefault();
    try { await A.signInWithEmailAndPassword(auth, emailKey($("#lg-em").value), $("#lg-pw").value); }
    catch(err){ showLogin(err.code==="auth/invalid-credential"||err.code==="auth/wrong-password"||err.code==="auth/user-not-found" ? "Sai email hoặc mật khẩu." : "Chưa đăng nhập được: "+(err.code||err.message)); } };
  $("#lg-fg").onclick = async () => { const em=emailKey($("#lg-em").value); if(!em) return toast("Nhập email trước rồi bấm Quên mật khẩu.");
    try { await A.sendPasswordResetEmail(auth, em); toast("Đã gửi email đặt lại mật khẩu."); } catch(err){ toast("Không gửi được: "+(err.code||err.message)); } };
}
async function onUser(u){
  if (!u || u.isAnonymous || !u.email) return showLogin();
  const em = emailKey(u.email);
  let p = null;
  try { const s = await F.getDoc(F.doc(fdb,USERS,em)); p = s.exists()? s.data() : null; } catch(e){ console.error(e); }
  if (em === emailKey(ADMIN_EMAIL)) { if (!p || p.quyen!=="admin" || p.active===false) { p = {name:"Quản lý TNP", ...(p||{}), email:em, quyen:"admin", active:true}; try { await F.setDoc(F.doc(fdb,USERS,em), p); } catch(e){ console.error(e); } } }
  if (!p || p.active === false) { await A.signOut(auth); return showLogin(p ? "Tài khoản này đã bị khóa. Liên hệ Quản lý." : "Tài khoản "+em+" chưa được cấp quyền dùng Kho TNP. Liên hệ Quản lý."); }
  isAdmin = p.quyen === "admin";
  const q = isAdmin ? "ghi" : (p.quyen || "xem");
  me = em; myId = em; canWrite = q === "ghi"; profiles[em] = p;
  db = makeDb(); connState = "ok";
  for (const c of COLS) { S.ready[c]=0; }
  render(); backupInfo();
  if (isAdmin) unsubs.push(F.onSnapshot(F.collection(fdb,USERS), s => { for (const d of s.docs) profiles[d.id] = {email:d.id, ...d.data()}; resolveNames(); backupInfo(); }, e => console.warn("profiles", e)));
  for (const col of COLS) {
    db.collection(col).onSnapshot(snap => { const o={}; for (const x of snap.docs) o[x.id]=x.data(); S[col]=o; S.ready[col]=1; render(); backupInfo();
        if (isAdmin && col==="nhap" && COLS.every(c=>S.ready[c]) && !COLS.some(c=>Object.keys(S[c]).length)) setTimeout(mData, 300); },
      err => { console.error(err); if (err.code==="permission-denied") $("#main").innerHTML = `<div class="empty"><b>Firebase chưa cho phép đọc dữ liệu Kho TNP</b>Kiểm tra lại luật trong Firebase Console → Firestore → Rules.</div>`; else toast("Mất kết nối dữ liệu, đang thử lại…"); });
  }
}

/* ---------- khởi động ---------- */
render(); backupInfo();
(async () => {
  try {
    if (firebaseConfig.apiKey.startsWith("PASTE") || ADMIN_EMAIL.startsWith("DIEN")) { connState="none"; backupInfo(); $("#main").innerHTML=`<div class="empty"><b>Chưa cấu hình Firebase</b>Mở file index.html, điền phần CẤU HÌNH (email Quản lý và 6 dòng firebaseConfig).</div>`; return; }
    let fsM, auM; [appM, fsM, auM] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`),
      import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`)]);
    F = fsM; A = auM;
    const app = appM.initializeApp(firebaseConfig, "khotnp");
    fdb = F.initializeFirestore(app, { ignoreUndefinedProperties: true });
    auth = A.getAuth(app);
    A.onAuthStateChanged(auth, u => { onUser(u).catch(e => { console.error(e); showLogin("Lỗi: "+(e.code||e.message)); }); });
  } catch (e) {
    console.error(e); connState="none"; backupInfo();
    $("#main").innerHTML = `<div class="empty"><b>Không tải được Firebase</b>Kiểm tra kết nối mạng rồi tải lại trang.</div>`;
  }
})();

})();
</script>
